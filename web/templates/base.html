<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Caçador de Preços & Glitches{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        cardborder: '#334155',
                        accentgreen: '#10b981',
                        accentred: '#ef4444',
                        accentamber: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="{{ base_path or '/' }}" class="flex items-center gap-2 text-xl font-bold tracking-tight text-white hover:opacity-90">
                <span class="text-2xl">⚡</span>
                <span>Caçador<span class="text-emerald-400">DeOfertas</span></span>
            </a>
            <div class="flex items-center gap-4 text-sm font-medium">
                <a href="{{ base_path or '/' }}" class="text-slate-300 hover:text-white transition">Últimas Quedas</a>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">

                    🟢 Bot 24/7 Ativo
                </span>
            </div>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-950/40 py-6 text-center text-xs text-slate-500">
        <div class="max-w-6xl mx-auto px-4">
            <p>⚡ PriceGlitch & Drop Agent • Monitoramento estatístico em tempo real de Amazon, Mercado Livre e Shopee.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
